name: 🔮 Daily Oracle

on:
  schedule:
    - cron: '0 7 * * *'   # 8:00 sáng giờ UK (BST) mỗi ngày
  workflow_dispatch:

jobs:
  daily-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài thư viện
        run: pip install requests

      - name: 🔮 Chay Daily Oracle
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_KEY:    ${{ secrets.ANTHROPIC_KEY }}
        run: python daily_oracle.py
